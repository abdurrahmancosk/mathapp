name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testleri çalıştır ve APK oluştur
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk MatematikMerdiveni.apk

      - name: APK'yı yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MatematikMerdiveni-apk
          path: MatematikMerdiveni.apk

      - name: Test raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/

      - name: APK'yı "Releases" sayfasında yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MatematikMerdiveni.apk \
            --target "$GITHUB_SHA" \
            --title "Matematik Merdiveni - son sürüm" \
            --notes "Telefona kurmak için MatematikMerdiveni.apk dosyasını indirip açın. (Commit: ${GITHUB_SHA::7})"
